# ============================================================================
#  inmc-urb  ·  얼티메이트 랜덤박스
# ----------------------------------------------------------------------------
#  · 메시지는 MiniMessage 형식입니다 → https://webui.advntr.dev/
#    (&a 같은 예전 색코드도 그대로 쓸 수 있습니다)
#  · PlaceholderAPI 가 설치되어 있으면 %papi_...% 도 사용할 수 있습니다.
#  · 시간 값 형식: 1d 1h 1m 1s  (0 = 사용 안 함)
#  · 사용 가능한 플레이스홀더
#      {상자이름} {플레이어네임} {좌표} {열쇠이름} {필요한돈} {아이템}
#      {world} {x} {y} {z}
#    영문 별칭도 됩니다: {box} {player} {location} {key} {money} {item}
# ============================================================================

# ---------------------------------------------------------------------------
# 상자 기본값
#   새 상자를 만들 때 이 값들이 적용되고, 상자 파일에서 값을 지우면
#   여기 값으로 되돌아갑니다. 상자별 설정은 /urb GUI 에서 바꿉니다.
# ---------------------------------------------------------------------------
defaults:
  # 디폴트 월드
  world: "world"

  # 디폴트 상자 생성 좌표값
  #   enabled: true 로 두면 새로 만든 상자가 이 좌표를 특정 좌표로 갖고,
  #   주변 ±100 블록이 랜덤 영역으로 잡힙니다.
  spawn-location:
    enabled: false
    world: "world"
    x: 0
    y: 64
    z: 0

  # 맵에 나타날 블록. 상자 계열이 아니어도 됩니다.
  #   예) STONE 으로 두면 돌처럼 보이지만 클릭하면 상자 창이 열립니다.
  block: "CHEST"

  # 디폴트 상자 자동 에어드랍 시간
  auto-spawn-interval: "1h"

  # 디폴트 상자 소멸 시간 (0 = 소멸하지 않음)
  despawn-after: "10m"

  # 디폴트 상자 최대 생성 갯수 (상자별로 각각 적용)
  max-spawn-count: 3

  # 디폴트 아이템 나올 확률 (0.01 ~ 100)
  item-chance: 50.0

  # 상자를 여는 데 걸리는 시간(초). 이 동안 움직이면 취소됩니다.
  open-time: 3

  # 열기가 취소된 뒤 다시 시도하기까지 기다리는 시간(초)
  reopen-cooldown: 10

  # 한 번 열 때 나오는 보상 개수 범위
  #   등록된 아이템은 각자 독립적으로 추첨되고, 당첨된 것 중 최대 max-rolls 개만
  #   지급됩니다. 아무것도 당첨되지 않아도 min-rolls 개는 반드시 나옵니다.
  min-rolls: 1
  max-rolls: 2

  # 상자별로 따로 지정하지 않았을 때 쓰이는 메시지
  messages:
    spawn: "<white>{world}월드에 <yellow>{상자이름}</yellow> 상자가 생성되었습니다! 위치: <gray>{x}, {z}</gray></white>"
    despawn: "<gray>{world}월드의 {상자이름} 상자가 시간이 되어 소멸하였습니다! 위치: {x}, {z}</gray>"
    open: "<white><yellow>{플레이어네임}</yellow>님이 <yellow>{상자이름}</yellow> 상자를 열었습니다! 위치: <gray>{좌표}</gray></white>"

    # /urb spawnnow 와 GUI 의 '지금 소환' 으로 만든 상자도 등장 메시지를 낼지.
    # 보통 관리 작업이므로 기본은 꺼짐입니다.
    broadcast-manual-spawn: false

    # 캡슐 아이템을 우클릭해 연 경우의 오픈 메시지 (맵 상자와 별개로 조정)
    broadcast-capsule-open: true

  # 연출 기본값 (상자별로 덮어쓸 수 있습니다)
  visual:
    # 상자 주변 파티클. 사용 가능 (15종 + 없음):
    #   NONE / SPARKLE / FLAME_RING / SOUL_RISE / ENCHANT_SWIRL / PORTAL_VORTEX
    #   END_ROD_BEAM / HEART_FLOAT / NOTE_POP / CLOUD_HALO / GOLD_DUST
    #   SPIRAL / FOUNTAIN / CRIT_BURST / SPARK_RING / RAINBOW
    particle: NONE

    # 상자 위에 이름과 남은 시간을 띄웁니다 (표시용 엔티티, 서버에 저장되지 않음)
    hologram: false

    # 상자를 열었을 때의 연출
    #   NONE     : 연출 없이 바로 지급
    #   ROULETTE : 후보 아이템이 돌다가 결과에 멈춤
    #   REVEAL   : 보상이 하나씩 차례로 등장
    #   ※ 추첨은 연출이 시작되기 전에 이미 끝나 있습니다. 창을 닫거나
    #      접속이 끊겨도 보상은 그대로 지급됩니다.
    animation: NONE

    # 보상이 손에 들어오는 순간의 연출
    #   NONE / TOTEM / FIREWORK / LIGHTNING / FANFARE / BEAM
    #   LIGHTNING 은 번개 '모양' 만 내려칩니다 (피해·화재 없음)
    flair: NONE

    # (구버전 호환) flair 를 지정하지 않았을 때만 참조합니다
    totem-effect: false

# ---------------------------------------------------------------------------
# 생성 동작
# ---------------------------------------------------------------------------
spawn:
  # 청크가 로드되어 있지 않은 좌표에 상자가 뽑히면, 공지는 즉시 나가고 실제 블록은
  # 대기열에 들어갑니다. 누군가 그 좌표로 이동해 청크가 열리면 그때 나타납니다.
  # (청크를 강제로 생성하지 않기 때문에 서버 부하가 없습니다)
  #
  # 대기열에 남아 있을 수 있는 최대 시간입니다. 이 시간이 지나면 소멸 처리됩니다.
  pending-max-age: "2d"

  # 대기열 최대 개수 (안전장치)
  pending-limit: 500

  # 소멸 시간을 언제부터 세는지
  #   ON_PLACE    : 블록이 실제로 놓인 시점부터 (권장)
  #   ON_ANNOUNCE : 공지가 나간 시점부터
  despawn-timer-start: ON_PLACE

  # 랜덤 영역에서 좌표를 뽑을 때, 이미 로드된 청크를 몇 번까지 우선 시도할지.
  # 크게 잡을수록 대기열을 덜 쓰지만 좌표 계산이 조금 늘어납니다.
  loaded-chunk-attempts: 24

  # 아무도 접속해 있지 않을 때 자동 생성을 멈출지
  require-players-online: true

  # 등장 공지 끝에 클릭 가능한 [추적하기] 버튼을 붙일지.
  # 누르면 나침반이 그 상자를 가리킵니다. (추적 허용이 꺼진 상자에는 안 붙습니다)
  # 버튼 모양은 messages.yml 의 spawn-track-button 에서 바꿉니다.
  track-button: true

# ---------------------------------------------------------------------------
# 서버 종료 동작
# ---------------------------------------------------------------------------
shutdown:
  # 꺼질 때 고정 설치(PERMANENT)가 아닌 상자는 전부 치웁니다 — 놓인 것(원래 블록 복원)과
  # 아직 안 놓인 대기열. 켜질 때도 남아 있던 비고정 상자를 추적해 지웁니다.
  # true 로 두면 고정 설치까지 전부 치웁니다.
  cleanup-all: false

# ---------------------------------------------------------------------------
# /urb search  ·  상자 위치 검색
# ---------------------------------------------------------------------------
search:
  # 일반 유저가 다시 검색하기까지 기다려야 하는 시간 (관리자는 제한 없음)
  cooldown: "5m"

  # 아직 청크가 열리지 않아 대기 중인 상자도 검색 결과에 보여줄지
  show-pending: true

# ---------------------------------------------------------------------------
# /urb notice  ·  공지 확인창
# ---------------------------------------------------------------------------
notice:
  # 보관할 당첨 기록 수
  history-size: 54

# ---------------------------------------------------------------------------
# 통계 · 오픈 기록 (/urb stats, /urb log, /urb ranking)
#   누가 몇 번 열었고 무엇이 나왔는지 기록합니다. data/stats.yml 에 저장되어
#   재시작해도 유지되며, 상자 관리 GUI → '통계 · 오픈 기록' 에서 볼 수 있습니다.
#   설정 확률과 실제 출현률을 나란히 비교해 주므로, 시뮬레이션 결과가 실제와
#   맞는지 확인하는 용도로 쓰면 됩니다.
# ---------------------------------------------------------------------------
stats:
  # 보관할 오픈 기록 수 (오래된 것부터 밀려납니다)
  log-size: 100

  # 랭킹 화면에 표시할 인원 수
  ranking-size: 45

# ---------------------------------------------------------------------------
# 디스코드 알림
#   플러그인 설치가 필요 없습니다. 디스코드 채널 설정 →
#   연동 → 웹후크 → 새 웹후크 → URL 복사 후 아래에 붙여넣으세요.
#   비워두면 디스코드 관련 기능이 전부 꺼집니다.
# ---------------------------------------------------------------------------
discord:
  # 아래 두 훅이 비어 있을 때 사용할 공통 주소
  webhook-url: ""
  username: "랜덤박스"
  avatar-url: ""

  # 상자가 등장했을 때 (상자별로 '디스코드 알림' 을 꺼둘 수 있습니다)
  #   webhook-url 을 채우면 스폰 알림만 다른 채널로 보낼 수 있습니다.
  #   비워두면 위의 공통 주소를 씁니다. 상자별 설정이 있으면 그쪽이 우선입니다.
  spawn:
    enabled: true
    webhook-url: ""
    message: "📦 **{상자이름}** 상자가 {world} `{x}, {z}` 에 등장했습니다!"

  # 보상 설정에서 '당첨 시 서버 공지' 를 켠 아이템이 나왔을 때
  #   스폰 알림과 다른 채널로 보내려면 여기에 별도 주소를 넣으세요.
  reward:
    enabled: true
    webhook-url: ""
    message: "🎉 **{플레이어네임}** 님이 **{상자이름}** 에서 **{아이템}** 을(를) 획득했습니다!"

  # 상자가 소멸했을 때 (기본 꺼짐 — 켜면 알림이 꽤 잦아집니다)
  despawn:
    enabled: false
    message: "⌛ **{상자이름}** 상자가 {world} `{x}, {z}` 에서 소멸했습니다."

# ---------------------------------------------------------------------------
# 보상 시뮬레이션 (어드민 전용)
#   상자 관리 GUI → '보상 시뮬레이션' 에서 실행합니다.
#   시행 횟수는 실행할 때 직접 입력하며, 아래 값이 그 상한입니다.
#
#   참고: 확률 0.01% 아이템도 1000만 회면 오차 ±3% 수준까지 안정됩니다.
#         그 이상은 시간만 더 걸리고 얻는 정보는 거의 없습니다.
# ---------------------------------------------------------------------------
simulation:
  max-iterations: 10000000
